[project]
name = "backend"
version = "0.1.0"
description = "Property search API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
